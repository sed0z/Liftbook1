<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Liftbook">
<meta name="theme-color" content="#FBF5E9">
<title>Liftbook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
/* Layout: one phone-width column, sticky top bar, fixed bottom tabs; workouts open as a full-screen layer, edits happen in bottom sheets.
   Look: warm paper ground, one orange accent, peach "skin" buttons, hairline borders instead of shadows. A committed single light theme. */
:root{
  --bg:#FBF5E9; --surface:#FFFDF8; --surface-2:#F7EEDF; --line:#EFE4D2; --line-strong:#E0D0B8;
  --ink:#2E2219; --muted:#7E6A5A; --faint:#B09C8A;
  --accent:#EE7A2F; --accent-ink:#FFFFFF; --accent-soft:#FDE6D3;
  --btn:#F8DDCD; --btn-ink:#7A4630; --bone:#FFF4E4;
  --gold:#B57A0A; --gold-bg:#FFF0C8; --good:#3E8A57; --good-bg:#E4F2E2; --warn:#C8552A; --warn-bg:#FCE3D6; --danger:#B93B2F;
  --plate-red:#D9493F; --plate-blue:#3C68D8; --plate-yellow:#E9B42A; --plate-green:#3C9A62; --plate-white:#E8E1D6; --plate-steel:#A89C8F;
  --shadow:0 0 0 1px var(--line);
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* shell */
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand h1{font-size:26px;line-height:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="cloud"] i{background:var(--good)}
.sync[data-s="saving"] i{background:var(--gold)}
.sync[data-s="local"] i,.sync[data-s="offline"] i{background:var(--warn)}
main{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:21px}
.link{color:var(--accent);font-weight:600;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
.tab[aria-current="page"]{color:var(--accent)}

/* cards & buttons */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--warn-bg);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line-strong)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:var(--gold-bg);color:var(--gold)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.scroll-x::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{height:34px;padding:0 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* train */
.hero{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-38px;top:-38px;width:150px;height:150px;border-radius:50%;border:16px solid var(--accent-soft);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.prog-switch{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);height:30px;padding:0 10px 0 12px;border-radius:99px}
.hero h2{font-size:40px;line-height:.95;position:relative;z-index:1}
.hero-list{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.resume-meta{display:flex;gap:16px;flex-wrap:wrap}
.stat-inline b{font-family:var(--font-display);font-size:24px;display:block;line-height:1}
.stat-inline span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--faint)}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:11px;background:var(--surface);border:1.5px dashed var(--line-strong);display:grid;place-items:center;font-style:normal;color:var(--accent-ink)}
.wd.on i{background:var(--accent);border:0}
.wd.today{color:var(--ink)}
.wd.today i{border-color:var(--accent)}
.days-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day-card{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border:1.5px solid transparent;min-width:0}
.day-card.next{border-color:var(--accent)}
.day-card h3{font-size:21px;line-height:1.05}
.day-card small{font-size:12px;color:var(--muted)}
.day-card.empty{background:transparent;border:1.5px dashed var(--line-strong);box-shadow:none;justify-content:center;align-items:center;color:var(--muted);font-weight:600;min-height:92px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:13px;color:var(--muted)}
.row-side{text-align:right;font-size:13px;color:var(--muted);flex:none}
.date-badge{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0}
.date-badge b{display:block;font-family:var(--font-display);font-size:20px;line-height:1}
.date-badge span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty-state{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty-state b{color:var(--ink);font-size:15px}

/* session layer */
#session{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#session[hidden]{display:none!important}
.s-head{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.s-head-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.s-title{flex:1;min-width:0}
.s-title h2{font-size:23px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-title .num{font-size:13px;color:var(--muted)}
.s-progress{height:3px;background:var(--line)}
.s-progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.s-body-in{max-width:600px;margin:0 auto;padding-block:14px 150px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.ex-list{display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px}
.ex.complete{box-shadow:inset 0 0 0 1.5px var(--good),var(--shadow)}
.ex-head{display:flex;align-items:flex-start;gap:6px}
.grip,.grip-day{width:30px;height:38px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none;border-radius:8px}
.grip:active,.grip-day:active{cursor:grabbing;background:var(--surface-2)}
.ex-title{flex:1;min-width:0;padding-top:2px}
.ex-title h3{font-size:21px;line-height:1.1}
.ex-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px}
.goal svg{color:var(--accent)}
.goal b{color:var(--accent)}
.goal.up{background:var(--good-bg)}
.goal.up b,.goal.up svg{color:var(--good)}
.goal.first{background:var(--surface-2)}
.goal.first b,.goal.first svg{color:var(--muted)}
.goal-txt{flex:1;min-width:0}
.goal-sub{display:block;font-size:12px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:34px minmax(0,1fr) 74px 58px 44px;gap:7px;align-items:center}
.set-h{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 0 2px}
.set-h span:nth-child(3),.set-h span:nth-child(4){text-align:center}
.set{border-radius:12px;padding:3px;transition:background .2s}
.set.done{background:var(--good-bg)}
.set-n{height:38px;border-radius:9px;background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:17px}
.set.warm .set-n{background:var(--gold-bg);color:var(--gold)}
.prev{height:38px;text-align:left;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.prev:disabled{cursor:default}
.in{width:100%;height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px;-moz-appearance:textfield}
.in::placeholder{color:var(--faint);font-weight:500}
.in:focus{border-color:var(--accent);background:var(--surface);outline:none}
.set.done .in{background:transparent;border-color:transparent}
.tick{height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--faint);border:1.5px solid var(--line)}
.set.done .tick{background:var(--good);color:#fff;border-color:var(--good)}
.pr-line{display:flex;gap:6px;align-items:center;margin:-2px 0 2px 41px;flex-wrap:wrap}
.ex-foot{display:flex;gap:8px;align-items:center}
.ex-foot .btn{flex:1}
.note{width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);padding:9px 11px;resize:vertical;font-size:16px}
.s-add{border:1.5px dashed var(--line-strong);border-radius:var(--r);height:56px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent);font-weight:600}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:31;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.rest-in{pointer-events:auto;max-width:576px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest-time{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;min-width:66px}
.rest-lbl{flex:1;font-size:12px;opacity:.7;min-width:0}
.rest-in button{height:38px;min-width:46px;padding:0 10px;border-radius:10px;background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:600;font-size:14px}
.rest.done .rest-in{background:var(--good);color:#fff}

/* program */
.prog-head{display:flex;align-items:center;gap:10px}
.prog-head h2{font-size:30px;flex:1;min-width:0;line-height:1}
.days{display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.day-h{display:flex;align-items:center;gap:4px;padding:10px 6px 8px 4px}
.day-h h3{font-size:22px;flex:1;min-width:0;line-height:1.05}
.day-h small{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.items{list-style:none;margin:0;padding:0 8px;min-height:12px}
.item{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 0;border-top:1px solid var(--line);background:var(--surface)}
.item-main{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:8px}
.item-name{flex:1;min-width:0}
.item-name b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-name span{font-size:12px;color:var(--muted)}
.item-scheme{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);white-space:nowrap}
.day-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;color:var(--accent);font-weight:600;font-size:14px;border-top:1px solid var(--line)}
.sortable-ghost{opacity:.3}
.sortable-fallback{box-shadow:0 12px 30px rgba(0,0,0,.18)!important;border-radius:12px;opacity:.95!important}
.sortable-chosen .grip,.sortable-chosen .grip-day{color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* volume bars */
.vol{display:flex;flex-direction:column;gap:9px}
.vol-row{display:grid;grid-template-columns:86px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.vol-row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol-track{position:relative;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.vol-zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 16%,transparent)}
.vol-fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:99px;background:var(--accent)}
.vol-fill.low{background:var(--warn)}
.vol-fill.high{background:var(--gold)}
.vol-plan{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.vol-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:3px;display:inline-block}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.tile b{display:block;font-family:var(--font-display);font-size:32px;line-height:1;margin-top:4px}
.tile small{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:100%;min-width:12px;aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface-2))}
.heat i.l3{background:var(--accent)}
.heat i.future{background:transparent}
.search{position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px 0 40px;font-size:16px}
.search svg{position:absolute;left:13px;top:12px;color:var(--faint)}
.chart{width:100%;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .end-lbl{font-weight:700;fill:var(--ink);font-size:12px}
.chart-empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2);border-radius:12px}

// ---------- PROGRESS ----------
let progressQ = "";
function viewProgress() {
  if (!W.length) return `<section class="sec"><h2 style="font-size:30px">Progress</h2><div class="empty-state"><b>Your charts start after the first workout</b>Log a session from Train. Personal records, weekly volume and strength trends appear here.</div></section>` + stdCard() + toolsLinkCard();
  const now = Date.now(), ws = startOfWeek(now);
  const thisWeek = W.filter(w => w.startedAt >= ws);
  const setsWeek = thisWeek.reduce((a, w) => a + w.entries.reduce((b, e) => b + e.sets.filter(s => !s.warm).length, 0), 0);
  let streak = 0; { let k = thisWeek.length ? ws : ws - 7 * DAY; while (W.some(w => w.startedAt >= k && w.startedAt < k + 7 * DAY)) { streak++; k -= 7 * DAY; } }
  const allPRs = []; W.forEach(w => (w.prs || []).forEach(p => allPRs.push({...p, t: w.startedAt})));
  const tiles = `<div class="tiles"><div class="tile"><small>Workouts this week</small><b class="num">${thisWeek.length}</b></div><div class="tile"><small>Sets this week</small><b class="num">${setsWeek}</b></div><div class="tile"><small>Week streak</small><b class="num">${streak}</b></div><div class="tile"><small>PRs, last 30 days</small><b class="num">${allPRs.filter(p => p.t > now - 30 * DAY).length}</b></div></div>`;

  const done = {}; thisWeek.forEach(w => w.entries.forEach(e => { const m = exInfo(e.ex).muscle; done[m] = (done[m] || 0) + e.sets.filter(s => !s.warm).length; }));
  const plan = weeklyPlan(activeProgram());
  const ms = MUSCLES.filter(m => done[m] || plan[m]);
  const vol = `<section class="card sec"><div class="sec-h"><h2>Sets per muscle this week</h2></div>${volBars(ms.map(m => ({m, v: done[m] || 0, plan: plan[m] ? Math.round(plan[m]) : null})), {noLow: true, fmt: r => `${r.v}${r.plan != null ? "/" + r.plan : ""}`})}<div class="legend"><span><i style="background:var(--accent)"></i>Done</span><span><i style="background:var(--ink);opacity:.55;width:2px"></i>Planned in ${esc(activeProgram().name)}</span><span><i style="background:color-mix(in srgb,var(--good) 25%,transparent)"></i>10–20 sets</span></div></section>`;

  const weeks = 18, start = startOfWeek(now) - (weeks - 1) * 7 * DAY, perDay = {};
  W.forEach(w => { if (w.startedAt >= start) { const k = startOfDay(w.startedAt); perDay[k] = (perDay[k] || 0) + w.entries.reduce((b, e) => b + e.sets.filter(s => !s.warm).length, 0); } });
  let cells = ""; for (let i = 0; i < weeks * 7; i++) { const t = start + i * DAY; const k = startOfDay(t + 3 * 3600e3); const v = perDay[k] || 0; cells += `<i class="${t > now ? "future" : v > 20 ? "l3" : v > 10 ? "l2" : v > 0 ? "l1" : ""}" title="${new Date(t).toDateString()}: ${v} sets"></i>`; }

  const prs = allPRs.sort((a, b) => b.t - a.t).slice(0, 6);
  const prSec = `<section class="sec"><div class="sec-h"><h2>Recent PRs</h2></div>${prs.length ? `<div class="list">${prs.map(p => `<button class="row" data-act="ex-detail" data-id="${esc(p.ex)}"><span class="chip gold">${ICON.trophy.replace('class="i"', 'class="i" style="width:14px;height:14px"')}</span><div class="row-main"><b>${esc(exInfo(p.ex).name)}</b><span class="num">${fw(p.w)} ${U()} × ${p.r} · ${esc(p.kind)}</span></div><span class="row-side">${relDay(p.t)}</span></button>`).join("")}</div>` : `<div class="empty-state">No PRs yet. They are flagged the moment you tick a set that beats your history.</div>`}</section>`;

  const exSec = `<section class="sec"><div class="sec-h"><h2>Lifts</h2></div><div class="search">${ICON.search}<input id="exQ" placeholder="Search your lifts" value="${esc(progressQ)}" autocomplete="off"></div><div class="list" id="exRows">${exRows()}</div></section>`;

// ---------- summaries ----------
let sumMode = "week", sumOff = 0, mapData = null;
function periodRange(mode, off) {

  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(1); d.setMonth(d.getMonth() + off);
  const e = new Date(d); e.setMonth(e.getMonth() + 1); return [d.getTime(), e.getTime()];
}
function periodLabel(mode, off, a, b) {
  const f = t => new Date(t).toLocaleDateString(undefined, {month: "short", day: "numeric"});
  if (mode === "week") return [off === 0 ? "This week" : off === -1 ? "Last week" : "Week of " + f(a), f(a) + " – " + f(b - DAY)];
  return [off === 0 ? "This month" : off === -1 ? "Last month" : new Date(a).toLocaleDateString(undefined, {month: "long"}), new Date(a).toLocaleDateString(undefined, {month: "long", year: "numeric"})];
}
function periodStats(a, b) {

    w.entries.forEach(e => { const m = exInfo(e.ex).muscle; e.sets.forEach(s => { if (s.warm) return; sets++; vol += s.w * s.r; mus[m] = (mus[m] || 0) + 1; }); }); });

}
function liftChanges(a, b) {

    for (const s of histFor(ex)) { const m = Math.max(...s.sets.map(x => e1rm(x.w, x.r))); if (s.t >= a && s.t < b) now = Math.max(now, m); else if (s.t < a && !before) before = m; }

  const body = !cur.ws.length ? `<div class="empty-state">No workouts ${sumOff === 0 ? "yet this " + sumMode : "this " + sumMode}.</div>${bodyMap(per)}` : `
    <div class="sum4">

      <div><small>Working sets</small><b class="num">${cur.sets}</b>${delta(cur.sets, prev.sets)}</div>

// Synthesized on the spot (no audio files): a woody clack per bone rising up a scale,
// a low thunk for the bar, a cartoon boing on the wobble and a chime for the name.
function introSound(ctx) {
  const t0 = ctx.currentTime + 0.03, out = ctx.createGain(); out.gain.value = 0.6; out.connect(ctx.destination);
  const nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 3);
  const env = (g, t, peak, len) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + len); };
  const clack = (t, f, vol) => {
    const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    n.buffer = nb; bp.type = "bandpass"; bp.frequency.value = Math.min(6000, f * 3); bp.Q.value = 5; ng.gain.value = 0.45 * vol;
    n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t);
    [[1, 0.42, 0.24], [2.76, 0.12, 0.09], [5.4, 0.05, 0.05]].forEach(([h, peak, len]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine";
      o.frequency.setValueAtTime(f * h * 1.08, t); o.frequency.exponentialRampToValueAtTime(f * h, t + 0.04);
      env(g, t, peak * vol, len); o.connect(g); g.connect(out); o.start(t); o.stop(t + len + 0.05);
    });
  };
  [[0.57, 523], [0.8, 659], [1.02, 784], [1.22, 988]].forEach(([d, f]) => { clack(t0 + d, f, 1); clack(t0 + d + 0.21, f * 1.5, 0.22); });
  clack(t0 + 1.46, 196, 1.3); clack(t0 + 1.47, 392, 0.5);
  const tb = t0 + 1.66, o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(150, tb); o.frequency.exponentialRampToValueAtTime(460, tb + 0.32);
  lfo.frequency.value = 19; lg.gain.value = 38; lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, tb); g.gain.exponentialRampToValueAtTime(0.32, tb + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, tb + 0.42);
  o.connect(g); g.connect(out); o.start(tb); lfo.start(tb); o.stop(tb + 0.45); lfo.stop(tb + 0.45);
  [1568, 2093, 2637].forEach((f, i) => { const t = t0 + 1.86 + i * 0.07, oc = ctx.createOscillator(), gc = ctx.createGain(); oc.type = "sine"; oc.frequency.value = f; env(gc, t, 0.14, 0.7); oc.connect(gc); gc.connect(out); oc.start(t); oc.stop(t + 0.75); });
}
function playIntro() {
  let reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  if (reduce) return;
  const withSound = S.introSound !== false;
  const el = document.createElement("div"); el.id = "intro"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="intro-in">${boneLogo("intro-logo")}<div class="intro-word">Liftbook</div></div>${withSound ? `<div class="intro-tap">Tap to lift<small>Sound on</small></div>` : ""}`;
  document.body.appendChild(el);
  let t = null;
  const done = () => { el.classList.add("out"); setTimeout(() => el.remove(), 600); };
  const go = () => { el.classList.remove("wait"); t = setTimeout(done, 2600); };
  if (withSound) el.classList.add("wait"); else go();
  el.addEventListener("click", () => {
    if (el.classList.contains("wait")) { unlockAudio(); if (audioCtx) { try { introSound(audioCtx); } catch (e) {} } go(); return; }
    clearTimeout(t); done();
  });
}

function exRows() {
  const ids = Object.keys(S.exercises).filter(id => histFor(id).length && (!progressQ || S.exercises[id].name.toLowerCase().includes(progressQ.toLowerCase())));
  ids.sort((a, b) => histFor(b)[0].t - histFor(a)[0].t);
  if (!ids.length) return `<div class="row muted">No lifts match.</div>`;
  return ids.map(id => { const b = bests(id), h = histFor(id); const trend = h.length > 1 ? Math.max(...h[0].sets.map(s => e1rm(s.w, s.r))) - Math.max(...h[1].sets.map(s => e1rm(s.w, s.r))) : 0;
    return `<button class="row" data-act="ex-detail" data-id="${esc(id)}"><div class="row-main"><b>${esc(S.exercises[id].name)}</b><span>${esc(S.exercises[id].muscle)} · ${h.length} session${h.length > 1 ? "s" : ""} · ${relDay(h[0].t)}</span></div><div class="row-side"><b class="num" style="color:var(--ink);font-size:15px">${fe(b.maxE)}</b><br><span class="num" style="color:${trend > 0.05 ? "var(--good)" : trend < -0.05 ? "var(--warn)" : "var(--muted)"}">${trend > 0.05 ? "▲ " + fe(trend) : trend < -0.05 ? "▼ " + fe(-trend) : "e1RM"}</span></div></button>`; }).join("");
}
function niceStep(range, n) { const raw = range / n; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function lineChart(pts, Wd, H, fmtV) {
  if (pts.length < 2) return `<div class="chart-empty">Log this lift in at least two workouts to see a trend line.</div>`;
  const pL = 42, pR = 16, pT = 18, pB = 24;
  const ys = pts.map(p => p.v), xs = pts.map(p => p.t);
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
  const st = niceStep(hi - lo, 4); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st; if (hi === lo) hi += st;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => pL + (x1 === x0 ? .5 : (t - x0) / (x1 - x0)) * (Wd - pL - pR), Y = v => pT + (1 - (v - lo) / (hi - lo)) * (H - pT - pB);
  let g = ""; for (let v = lo; v <= hi + 1e-9; v += st) g += `<line class="grid" x1="${pL}" x2="${Wd - pR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pL - 7}" y="${Y(v) + 4}" text-anchor="end">${fmtV(v)}</text>`;
  const fd = t => new Date(t).toLocaleDateString(undefined, {month: "short", day: "numeric"});
  g += `<text x="${pL}" y="${H - 6}">${fd(x0)}</text><text x="${Wd - pR}" y="${H - 6}" text-anchor="end">${fd(x1)}</text>`;
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const area = d + ` L${X(x1).toFixed(1)} ${Y(lo)} L${X(x0).toFixed(1)} ${Y(lo)} Z`;
  const lp = pts[pts.length - 1];
  const dots = pts.length <= 24 ? pts.slice(0, -1).map(p => `<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="3"/>`).join("") : "";
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" width="100%" height="${H}" role="img" aria-label="Trend chart">${g}<path class="area" d="${area}"/><path class="ln" d="${d}"/>${dots}<circle class="end" cx="${X(lp.t)}" cy="${Y(lp.v)}" r="5"/><text class="end-lbl" x="${Math.min(X(lp.t), Wd - pR)}" y="${Y(lp.v) - 10}" text-anchor="end">${fmtV(lp.v)}</text></svg>`;
}
let chartMode = "e1rm";
function exDetail(id) {
  const e = exInfo(id), h = histFor(id), b = bests(id);
  const draw = () => {
    const pts = h.slice().reverse().map(s => ({t: s.t, v: toDisp(chartMode === "e1rm" ? Math.max(...s.sets.map(x => e1rm(x.w, x.r))) : chartMode === "top" ? Math.max(...s.sets.map(x => x.w)) : s.sets.reduce((a, x) => a + x.w * x.r, 0))}));
    const box = $("#chartBox"); if (!box) return;

  };
  const repRec = {}; h.forEach(s => s.sets.forEach(x => { const k = Math.round(toDisp(x.w) * 10) / 10; if (!repRec[k] || x.r > repRec[k].r) repRec[k] = {r: x.r, t: s.t}; }));

  const html = sheetHead(e.name, e.muscle) + `<div class="sheet-b">

    : `<div class="empty-state"><b>Not logged yet</b>Charts and records appear after you log this lift.</div>`}

function barKg() { return S.units === "kg" ? 20 : 45 * KG_PER_LB; }

      $("#mapInfo").innerHTML = `<b style="color:var(--ink)">${esc(m)}</b> · ${nfmt(n)} ${mapData ? mapData.label : "sets"} · ${zone}`; break; }
    case "std-sex": S.sex = b.dataset.v; saveState(); render(); break;
    case "rir-open": { const row = b.closest(".set"), en = entryOf(row), i = +row.dataset.i; en.rirFor = en.rirFor === i ? null : i; refreshEntry(en.id); break; }
    case "rir-set": { const pk = b.closest(".rir-pick"), en = D.entries.find(x => x.id === pk.dataset.eid); en.sets[+pk.dataset.i].rir = +b.dataset.v; en.rirFor = null; saveDraft(); refreshEntry(en.id); break; }
    case "set-introsound": S.introSound = S.introSound === false; saveState(); render(); break;
    case "set-askrir": S.askRir = !S.askRir; saveState(); render(); break;
    // tools
    case "bw-add": { const v = readNum($("#bwIn").value); if (v == null || v <= 0) { toast("Enter your body weight"); return; } S.bodyweight.push({t: Date.now(), kg: Math.round(fromDisp(v) * 100) / 100}); toolsState.bw = ""; saveState(); render(); toast("Body weight logged"); break; }
    case "bw-del": S.bodyweight = S.bodyweight.filter(p => String(p.t) !== b.dataset.t); saveState(); render(); break;
    case "set-units": S.units = b.dataset.v; saveState(); histCache = {}; render(); break;
    case "set-inc": S.incKg = +b.dataset.v; saveState(); render(); break;
    case "set-rest": S.defaultRest = Math.max(15, Math.min(600, S.defaultRest + (+b.dataset.d))); saveState(); render(); break;
    case "set-sound": S.sound = !S.sound; saveState(); render(); break;
    case "backup-copy": { S.lastBackup = Date.now(); saveState(); const txt = JSON.stringify({app: "liftbook", v: 1, state: S, workouts: W});
      const fallback = () => { $("#backupBox").innerHTML = `<div class="field"><label for="bkOut">Select all and copy</label><textarea class="tin" id="bkOut" readonly>${esc(txt)}</textarea></div>`; const t = $("#bkOut"); t.focus(); t.select(); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied. Paste it into Notes to keep it."), fallback); } catch (er) { fallback(); } break; }
    case "backup-import": $("#backupBox").innerHTML = `<div class="field"><label for="bkIn">Paste a Liftbook backup</label><textarea class="tin" id="bkIn" placeholder='{"app":"liftbook",…}'></textarea></div><div class="confirm"><span>Restoring replaces your programs and settings and adds the backup's workouts.</span><div class="acts"><button class="btn danger" data-act="backup-restore">Restore backup</button></div></div>`; break;
    case "backup-restore": restoreFrom($("#bkIn").value); break;
    case "backup-file": { S.lastBackup = Date.now(); saveState();
      const blob = new Blob([JSON.stringify({app: "liftbook", v: 1, state: S, workouts: W})], {type: "application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "liftbook-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      render(); toast("Backup saved. Keep it in Files or iCloud Drive."); break; }
  }
});
function restoreFrom(txt) {
  try { const o = JSON.parse(txt); if (o.app !== "liftbook") throw 0; S = normalize(o.state); saveState(); (o.workouts || []).forEach(w => w && w.id && putWorkout(w)); render(); toast(`Backup restored · ${(o.workouts || []).length} workouts`); }
  catch (er) { toast("That doesn't look like a Liftbook backup"); }
}
function findItemTemplate(ex) { for (const p of S.programs) for (const d of p.days) { const it = d.items.find(i => i.ex === ex); if (it) return it; } return null; }
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches(".in[data-f]")) {
    const en = entryOf(t); if (!en) return; const s = en.sets[+t.closest(".set").dataset.i];
    const v = readNum(t.value);
    if (t.dataset.f === "w") s.w = v == null ? null : Math.round(fromDisp(v) * 1000) / 1000; else s.r = v == null ? null : Math.round(v);
    saveDraft(); return;
  }
  if (t.matches("[data-note]")) { const en = D && D.entries.find(x => x.id === t.dataset.note); if (en) { en.note = t.value; saveDraft(); } return; }
  if (t.id === "pickQ") { $("#pickNew").hidden = true; $("#pickList").hidden = false; sheetCtx && sheetCtx.picker && sheetCtx.picker.refresh(); return; }
  if (t.id === "exQ") { progressQ = t.value; $("#exRows").innerHTML = exRows(); return; }
  if (t.id === "tmIn") { const {it} = ctxItem(); if (it) { const v = readNum(t.value); it.tm = v != null && v > 0 ? Math.round(fromDisp(v) * 100) / 100 : null; saveState(); } return; }
  if (t.id === "plateT") { toolsState.plateTarget = t.value; updateTools(); return; }
  if (t.id === "ormW") { toolsState.ormW = t.value; updateTools(); return; }
  if (t.id === "ormR") { toolsState.ormR = t.value; updateTools(); return; }
  if (t.id === "warmW") { toolsState.warmW = t.value; updateTools(); return; }
  if (t.id === "bwIn") { toolsState.bw = t.value; return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if (e.key === "Enter" && e.target.matches(".in[data-f]")) {
    e.preventDefault(); const row = e.target.closest(".set");
    if (e.target.dataset.f === "w") row.querySelector('[data-f="r"]').focus(); else { e.target.blur(); tickSet(row); }
  }
});
document.addEventListener("focusin", e => { if (e.target.matches(".in[data-f]")) setTimeout(() => { try { e.target.select(); } catch (er) {} }, 0); });
document.addEventListener("change", e => {
  if (e.target.id === "restoreFile" && e.target.files && e.target.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(e.target.files[0]); e.target.value = ""; return; } if (e.target.id === "tmIn") { const {d, it} = ctxItem(); const body = $("#itemBody"); if (it && body) body.innerHTML = itemEditBody(d, it); } });
window.addEventListener("resize", () => { if (sheetCtx && sheetCtx.chart) sheetCtx.chart(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && rest.end) drawRest(); });

// ---------- boot ----------
$(".brand-mark").innerHTML = boneLogo("logo");
playIntro();
render();
if (STANDALONE) {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (D) { /* show resume card; don't force the session open */ }
setSync();
connect();
})();
</script>
